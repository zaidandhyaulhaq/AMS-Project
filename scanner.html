<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Barcode Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    h3 { color: #333; margin-bottom: 10px; }
    #reader { width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .status-box { margin-top: 15px; padding: 15px; background: #fff; border: 2px solid #0d6efd; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; font-weight: bold; color: #0d6efd; }
  </style>
</head>
<body>
  <h3>Scan Barcode Paket</h3>
  <div id="reader"></div>
  <div class="status-box" id="status">Mengaktifkan Kamera...</div>

  <script>
    const scanner = new Html5Qrcode("reader");
    const statusEl = document.getElementById('status');

    function onScanSuccess(decodedText) {
      statusEl.innerHTML = "Berhasil scan: " + decodedText + "<br><small>Menutup kamera...</small>";
      
      // Kirim hasil scan kembali ke sistem Gas/HTML Anda
      if (window.opener) {
        window.opener.postMessage({ type: 'AI_BARCODE_SCANNED', value: decodedText }, "*");
        // Tutup tab scanner otomatis dalam 1 detik
        setTimeout(() => window.close(), 1000); 
      }
    }

    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } }, onScanSuccess)
      .then(() => statusEl.innerHTML = "Arahkan kamera ke Barcode Produk")
      .catch(err => statusEl.innerHTML = "Gagal akses kamera: " + err);
  </script>
</body>
</html>
